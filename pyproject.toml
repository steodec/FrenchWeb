[project]
name = "navigateur"
version = "0.0.1"
description = "Navigateur web léger basé sur Qt WebEngine : moins de RAM et de CPU que Chrome ou Edge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adblock",
    "psutil",
    "pyside6",
]

[project.scripts]
navigateur = "navigateur.__main__:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-cov",
    "pytest-qt",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigateur"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
# La couverture est mesurée à chaque lancement des tests, en local comme en CI.
addopts = "--cov=navigateur --cov-report=term-missing"

[tool.coverage.run]
branch = true
# Chemins relatifs : nécessaires pour générer le badge en CI.
relative_files = true

[tool.coverage.report]
# Seuil minimal : les tests échouent en dessous de 80 % de couverture.
fail_under = 80
exclude_also = ['if __name__ == "__main__":']
