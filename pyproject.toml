[project]
name = "navigateur"
version = "0.0.1"
description = "Navigateur web léger basé sur Qt WebEngine : moins de RAM et de CPU que Chrome ou Edge."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "adblock",
    "psutil",
    "pyside6",
]

[project.scripts]
navigateur = "navigateur.__main__:main"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "pytest-qt",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/navigateur"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
